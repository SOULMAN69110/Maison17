name: Mesures et publication

# Le dépôt et le site sont publics : les données personnelles n'y sont publiées que chiffrées
# (outils/coffre.js, phrase de passe dans le secret MAISON17_PHRASE). L'historique est rangé chiffré
# sur la branche « donnees » : la tâche l'ouvre, y ajoute les mesures, le rechiffre et le remplace
# (un seul commit, pas d'historique qui grossit). Si le secret manque, la tâche s'arrête sans rien publier.

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    env:
      MAISON17_PHRASE: ${{ secrets.MAISON17_PHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le coffre (branche donnees, chiffrée)
        uses: actions/checkout@v4
        with:
          ref: donnees
          path: coffre
          fetch-depth: 1

      - name: Ouvrir le coffre (historique et albums en clair, seulement dans la tâche)
        run: |
          echo "BASE_COFFRE=$(git -C coffre rev-parse HEAD)" >> "$GITHUB_ENV"
          node outils/coffre.js ouvrir coffre .

      - name: Récupérer les dernières mesures Mobile Alerts
        env:
          MOBILE_ALERTS: ${{ secrets.MOBILE_ALERTS }}
        run: |
          mkdir -p site
          python3 outils/mobile_alerts.py site/data.json

      - name: Récupérer la pluie dans l'heure (Météo-France)
        run: |
          curl -sS -m 20 "https://webservice.meteofrance.com/rain?lat=45.73&lon=4.80&lang=fr&token=__Wj7dVSTjV9YGu1guveLyDq0g7S7TfTjaHBTPTpO0kj8__" -o site/pluie.json || true
          python3 -c "import json;d=json.load(open('site/pluie.json'));assert d.get('forecast')" || rm -f site/pluie.json

      - name: Récupérer la production solaire (eStar Power)
        env:
          ESTAR_UTILISATEUR: ${{ secrets.ESTAR_UTILISATEUR }}
          ESTAR_MOT_DE_PASSE: ${{ secrets.ESTAR_MOT_DE_PASSE }}
        run: python3 outils/estar.py site/solaire.json

      - name: Préparer Python 3.13 (bibliothèque Home-SmartLink)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Récupérer le chauffage (Home-SmartLink, lecture seule)
        continue-on-error: true
        timeout-minutes: 4
        env:
          HSL_EMAIL: ${{ secrets.HSL_EMAIL }}
          HSL_MOT_DE_PASSE: ${{ secrets.HSL_MOT_DE_PASSE }}
        run: |
          pip install -q "homesmartlink==0.4.1" || true
          python3 outils/chauffage.py site/chauffage.json

      - name: Récupérer la pression (Open-Meteo)
        run: |
          curl -sS -m 30 "https://api.open-meteo.com/v1/forecast?latitude=45.73&longitude=4.80&current=pressure_msl&timeformat=unixtime" -o meteo.json || echo '{}' > meteo.json

      - name: Lire les albums Google Photos partagés (toutes les 6 h)
        continue-on-error: true
        timeout-minutes: 5
        run: python3 outils/photos.py photos/albums.txt photos/albums.json

      - name: Ajouter à l'historique, rechiffrer et ranger dans le coffre
        run: |
          python3 outils/historiser.py site/data.json meteo.json site/chauffage.json
          node outils/coffre.js fermer . coffre
          cd coffre
          git config user.name "Tableau de bord maison"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Coffre inchangé"; exit 0; fi
          # Un seul commit, remplacé à chaque passage
          git checkout -q --orphan nouveau
          git add -A
          git commit -q -m "Données chiffrées du $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"
          for essai in 1 2 3; do
            git push -q --force-with-lease=donnees:"$BASE_COFFRE" origin HEAD:donnees && exit 0
            # La page Photos a modifié la liste des albums entre-temps : on garde la sienne
            sleep 3
            git fetch -q --depth 1 origin donnees
            BASE_COFFRE=$(git rev-parse FETCH_HEAD)
            git checkout -q FETCH_HEAD -- photos/albums.txt 2>/dev/null || true
            git add -A
            git commit -q --amend --no-edit
          done
          echo "Coffre non enregistré (sera repris au prochain passage)"

      - name: Préparer le site (données chiffrées seulement)
        run: |
          cp index.html historique.html energie.html bilans.html lieux.html meteo.html chauffage.html photos.html verrou.js maj.js nav.js veille.js site/
          cp -r app site/
          node outils/coffre.js chiffrer site/data.json site/solaire.json site/chauffage.json
          node outils/coffre.js controle site/controle.txt
          mkdir -p site/historique site/photos
          cp coffre/historique/* site/historique/
          cp coffre/photos/albums.json site/photos/ 2>/dev/null || true
          cp photos/reglages.json site/photos/
          # Garde-fou : aucun fichier de données en clair ne part sur le site
          for f in site/data.json site/solaire.json site/chauffage.json site/historique/* site/photos/albums.json; do
            [ -e "$f" ] || continue
            head -c 6 "$f" | grep -q '^M17v1:' || { echo "Fichier non chiffré : $f"; exit 1; }
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
