name: Mesures et publication

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les dernières mesures Mobile Alerts
        run: |
          mkdir -p site
          IDS="077BD6BA8BF6,121D9CDE1215,121B8C435713,122897FF614E,1224E7AD1BFA,202D151D9A21,02129E969BF2"
          curl -sS -m 30 -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data "deviceids=$IDS" \
            https://www.data199.com/api/pv1/device/lastmeasurement -o site/data.json || true
          python3 -c "import json;d=json.load(open('site/data.json'));assert d.get('devices')" || echo '{"devices":[]}' > site/data.json

      - name: Récupérer la pluie dans l'heure (Météo-France)
        run: |
          curl -sS -m 20 "https://webservice.meteofrance.com/rain?lat=45.734&lon=4.802&lang=fr&token=__Wj7dVSTjV9YGu1guveLyDq0g7S7TfTjaHBTPTpO0kj8__" -o site/pluie.json || true
          python3 -c "import json;d=json.load(open('site/pluie.json'));assert d.get('forecast')" || rm -f site/pluie.json

      - name: Récupérer la production solaire (eStar Power)
        env:
          ESTAR_UTILISATEUR: ${{ secrets.ESTAR_UTILISATEUR }}
          ESTAR_MOT_DE_PASSE: ${{ secrets.ESTAR_MOT_DE_PASSE }}
        run: python3 outils/estar.py site/solaire.json

      - name: Préparer Python 3.13 (bibliothèque Home-SmartLink)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Récupérer le chauffage (Home-SmartLink, lecture seule)
        continue-on-error: true
        timeout-minutes: 4
        env:
          HSL_EMAIL: ${{ secrets.HSL_EMAIL }}
          HSL_MOT_DE_PASSE: ${{ secrets.HSL_MOT_DE_PASSE }}
        run: |
          pip install -q "homesmartlink==0.4.1" || true
          python3 outils/chauffage.py site/chauffage.json

      - name: Récupérer la pression (Open-Meteo)
        run: |
          curl -sS -m 30 "https://api.open-meteo.com/v1/forecast?latitude=45.734&longitude=4.802&current=pressure_msl&timeformat=unixtime" -o meteo.json || echo '{}' > meteo.json

      - name: Ajouter à l'historique et enregistrer dans le dépôt
        run: |
          python3 outils/historiser.py site/data.json meteo.json
          git config user.name "Tableau de bord maison"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historique
          if ! git diff --cached --quiet; then
            git commit -q -m "Historique : mesures du $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"
            for essai in 1 2 3; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && break
              sleep 5
            done
          fi

      - name: Préparer le site
        run: |
          cp index.html historique.html energie.html bilans.html lieux.html meteo.html verrou.js maj.js site/
          cp -r historique site/
          cp -r app site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
