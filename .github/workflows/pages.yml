name: Mesures et publication

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les dernières mesures Mobile Alerts
        run: |
          mkdir -p site
          IDS="salon,chambre-c,chambre-parents,chambre-y,bureau,sdb-filles,sdb-parents"
          curl -sS -m 30 -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data "deviceids=$IDS" \
            https://www.data199.com/api/pv1/device/lastmeasurement -o site/data.json || true
          python3 -c "import json;d=json.load(open('site/data.json'));assert d.get('devices')" || echo '{"devices":[]}' > site/data.json

      - name: Récupérer la pression (Open-Meteo)
        run: |
          curl -sS -m 30 "https://api.open-meteo.com/v1/forecast?latitude=45.73&longitude=4.80&current=pressure_msl&timeformat=unixtime" -o meteo.json || echo '{}' > meteo.json

      - name: Ajouter à l'historique et enregistrer dans le dépôt
        run: |
          python3 outils/historiser.py site/data.json meteo.json
          git config user.name "Tableau de bord maison"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historique
          if ! git diff --cached --quiet; then
            git commit -q -m "Historique : mesures du $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"
            for essai in 1 2 3; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && break
              sleep 5
            done
          fi

      - name: Préparer le site
        run: |
          cp index.html historique.html verrou.js site/
          cp -r historique site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
