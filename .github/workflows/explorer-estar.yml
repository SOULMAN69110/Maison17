name: Explorer eStar (temporaire)

# Tâche provisoire : essaie l'adresse eStar de la courbe du jour. À supprimer après usage.

on:
  workflow_dispatch:

jobs:
  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Essayer la courbe du jour
        env:
          ESTAR_UTILISATEUR: ${{ secrets.ESTAR_UTILISATEUR }}
          ESTAR_MOT_DE_PASSE: ${{ secrets.ESTAR_MOT_DE_PASSE }}
        run: python3 outils/sonder_estar.py
