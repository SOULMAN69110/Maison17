<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maison en courbes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Même identité que le tableau de bord : fond nuit, accent givre. Une colonne de graphiques, sélecteur de période en tête. */
:root{
  --nuit:#0f1418; --ardoise:#182027; --trait:#26313a;
  --craie:#e8eef2; --brume:#8a99a5; --givre:#7cc4e8;
  --display:"Bricolage Grotesque",system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--nuit);color:var(--craie);font-family:var(--display)}
.page{max-width:1200px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(28px,4vw,44px);font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.sous{color:var(--brume);margin-top:4px;font-size:15px}
a{color:var(--givre)}
.periodes{display:flex;gap:6px;flex-wrap:wrap}
.periodes button{font:500 14px var(--mono);color:var(--craie);background:var(--ardoise);border:1px solid var(--trait);border-radius:99px;padding:8px 14px;cursor:pointer}
.periodes button[aria-pressed="true"]{background:var(--givre);border-color:var(--givre);color:var(--nuit)}
.periodes button:focus-visible{outline:2px solid var(--givre);outline-offset:2px}
.choix{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
/* Navigation d'une période à l'autre : ◀ libellé ▶ */
.nav{display:flex;align-items:center;gap:8px}
.nav button{font:600 18px var(--mono);color:var(--craie);background:var(--ardoise);border:1px solid var(--trait);border-radius:99px;width:44px;height:40px;cursor:pointer}
.nav button:disabled{opacity:.3;cursor:default}
.nav button:focus-visible{outline:2px solid var(--givre);outline-offset:2px}
.nav .lib{font:600 17px var(--display);min-width:15em;text-align:center}
.nav .lib::first-letter{text-transform:uppercase}
.nav .auj{width:auto;padding:0 14px;font-size:13px}
/* Choix libre des dates (du … au …), ouvert par le bouton « 📅 Dates » */
.dates{display:none;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;font:500 14px var(--mono);color:var(--brume)}
.dates.ouvert{display:flex}
.dates input{font:500 15px var(--mono);color:var(--craie);background:var(--ardoise);border:1px solid var(--trait);border-radius:10px;padding:7px 10px;color-scheme:dark;min-width:9.5em}
.dates input:focus{outline:2px solid var(--givre);outline-offset:1px}
.dates button{font:600 14px var(--mono);color:var(--nuit);background:var(--givre);border:0;border-radius:99px;padding:9px 16px;cursor:pointer}
.dates .err{flex-basis:100%;text-align:right;color:#f08a6a;font-size:12px}
@media (max-width:760px){.choix{align-items:stretch;width:100%}.nav{justify-content:space-between}.nav .lib{min-width:0;flex:1;font-size:15px}.dates{justify-content:flex-start}}
.grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.bloc{background:var(--ardoise);border-radius:14px;padding:18px 18px 12px;min-width:0}
.bloc.large{grid-column:1 / -1}
.bloc h2{margin:0 0 4px;font-size:18px;font-weight:600}
.bloc .info{font-family:var(--mono);font-size:12px;color:var(--brume);margin-bottom:10px;font-variant-numeric:tabular-nums}
.toile{position:relative;height:280px}
.large .toile{height:340px}
.etat{font-family:var(--mono);font-size:13px;color:var(--brume)}
@media (max-width:760px){.grille{grid-template-columns:1fr}.toile,.large .toile{height:260px}}
</style>
<script src="verrou.js"></script>
<script src="veille.js"></script>
</head>
<body>
<main class="page">
  <header>
    <div>
      <h1>Maison en courbes</h1>
      <div class="sous">Mesures enregistrées depuis le 3 novembre 2026</div>
      <nav class="nav-pages"></nav><script src="nav.js"></script>
    </div>
    <div class="choix">
      <div class="periodes" role="group" aria-label="Période">
        <button type="button" data-unite="jour" aria-pressed="true">Jour</button>
        <button type="button" data-unite="semaine" aria-pressed="false">Semaine</button>
        <button type="button" data-unite="mois" aria-pressed="false">Mois</button>
        <button type="button" data-unite="annee" aria-pressed="false">Année</button>
        <button type="button" data-unite="libre" id="p-dates" aria-pressed="false" aria-controls="dates">📅 Dates</button>
      </div>
      <div class="nav">
        <button type="button" id="prec" aria-label="Période précédente">◀</button>
        <span class="lib" id="lib" aria-live="polite"></span>
        <button type="button" id="suiv" aria-label="Période suivante">▶</button>
        <button type="button" class="auj" id="auj">Aujourd'hui</button>
      </div>
      <form class="dates" id="dates" autocomplete="off">
        <label for="d-du">du</label><input type="date" id="d-du" min="2026-11-03" placeholder="jj/mm/aaaa">
        <label for="d-au">au</label><input type="date" id="d-au" min="2026-11-03" placeholder="jj/mm/aaaa">
        <button type="submit">Afficher</button>
        <div class="err" id="d-err" role="alert"></div>
      </form>
    </div>
  </header>
  <div class="etat" id="etat">Chargement de l'historique…</div>
  <section class="grille">
    <article class="bloc large"><h2>Températures des pièces</h2><div class="info" id="i-temp"></div><div class="toile"><canvas id="g-temp"></canvas></div></article>
    <article class="bloc"><h2>Dehors</h2><div class="info" id="i-ext"></div><div class="toile"><canvas id="g-ext"></canvas></div></article>
    <article class="bloc"><h2>Pression atmosphérique</h2><div class="info" id="i-pres"></div><div class="toile"><canvas id="g-pres"></canvas></div></article>
    <article class="bloc large"><h2>Humidité des pièces</h2><div class="info" id="i-hum"></div><div class="toile"><canvas id="g-hum"></canvas></div></article>
  </section>
</main>

<script>
/* Chart.js 4 exige un navigateur récent ; la télé Samsung 2018 reçoit Chart.js 2.9 (écrit pour les anciens navigateurs). */
var CHART_MODERNE = (function(){ try { new Function("var a={};return a?.b??1"); return typeof ResizeObserver === "function"; } catch (e) { return false; } })();
document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/' + (CHART_MODERNE ? '4.4.1/chart.umd.min.js' : '2.9.4/Chart.min.js') + '"><\/script>');
</script>
<script>
var CAPTEURS = [
  { id: "salon", nom: "Salon",           couleur: "#7cc4e8" },
  { id: "chambre-c", nom: "Chambre C.",        couleur: "#f0a6ca" },
  { id: "chambre-parents", nom: "Chambre parents", couleur: "#f0c36a" },
  { id: "chambre-y", nom: "Chambre Y.",       couleur: "#a99cf0" },
  { id: "bureau", nom: "Bureau",          couleur: "#7fd1a0" },
  { id: "sdb-filles", nom: "SdB filles",      couleur: "#f08a6a" },
  { id: "sdb-parents", nom: "SdB parents",     couleur: "#c9d4dc" }
];
var SALON = "salon";
var css = getComputedStyle(document.documentElement);
var BRUME = css.getPropertyValue("--brume").trim(), TRAIT = css.getPropertyValue("--trait").trim(), GIVRE = css.getPropertyValue("--givre").trim();

var lignes = { mesures: [], pression: [] }, graphiques = {}, jours = 1;
/* Période affichée : une unité (jour, semaine, mois, année) autour de la date « ref », ou des dates libres */
var unite = "jour", ref = new Date(), plage = null, P = null;   // P = { debut, fin } en secondes, recalculé à chaque rendu

function el(id){ return document.getElementById(id); }
function fmt(n, d){ return n.toFixed(d === undefined ? 1 : d).replace(".", ","); }

function lireCsv(texte){
  var l = texte.trim().split(/\r?\n/), entete = l.shift().split(","), out = [];
  l.forEach(function(x){
    var v = x.split(","), o = {};
    entete.forEach(function(k, i){ o[k] = v[i]; });
    out.push(o);
  });
  return out;
}

function charger(){
  return fetch("historique/index.json?t=" + Date.now(), { cache: "no-store" })
    .then(function(r){ if (!r.ok) throw new Error("aucun historique encore"); return r.json(); })
    .then(function(liste){
      /* seulement les capteurs et la pression : les fichiers du radiateur servent à la page Chauffage */
      liste = liste.filter(function(nom){ return nom.indexOf("mesures-") === 0 || nom.indexOf("pression-") === 0; });
      return Promise.all(liste.map(function(nom){
        return fetch("historique/" + nom).then(function(r){ return r.text(); }).then(function(t){
          var type = nom.indexOf("pression") === 0 ? "pression" : "mesures";
          lignes[type] = lignes[type].concat(lireCsv(t));
        });
      }));
    });
}

/* Moyenne par tranche de temps pour garder des courbes lisibles sur les longues périodes */
function pasPour(j){ return j <= 1 ? 0 : j <= 7 ? 3600 : j <= 30 ? 3 * 3600 : 86400; }
function serie(rangs, champ, debut){
  var pas = pasPour(jours), seaux = {}, pts = [], fin = P.fin;
  rangs.forEach(function(r){
    var ts = +r.horodatage, v = parseFloat(r[champ]);
    if (ts < debut || ts >= fin || isNaN(v)) return;
    if (!pas) { pts.push({ x: ts * 1000, y: v }); return; }
    var k = Math.floor(ts / pas) * pas;
    (seaux[k] = seaux[k] || []).push(v);
  });
  if (pas) Object.keys(seaux).sort().forEach(function(k){
    var s = seaux[k]; pts.push({ x: (+k + pas / 2) * 1000, y: s.reduce(function(a, b){ return a + b; }, 0) / s.length });
  });
  return pts.sort(function(a, b){ return a.x - b.x; });
}
function minMax(rangs, champ, debut){
  var mi = Infinity, ma = -Infinity, fin = P.fin;
  rangs.forEach(function(r){ var v = parseFloat(r[champ]), ts = +r.horodatage; if (ts >= debut && ts < fin && !isNaN(v)) { mi = Math.min(mi, v); ma = Math.max(ma, v); } });
  return mi === Infinity ? null : [mi, ma];
}

function etiquetteDate(ms){
  var d = new Date(ms);
  if (jours <= 1) return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  if (jours <= 30) return d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric" });
  return d.toLocaleDateString("fr-FR", { month: "short", year: "2-digit" });
}

function options(unite){
  return {
    responsive: true, maintainAspectRatio: false, animation: false, parsing: false, normalized: true,
    interaction: { mode: "nearest", axis: "x", intersect: false },
    elements: { point: { radius: 0, hoverRadius: 4 }, line: { borderWidth: 2, tension: 0.25 } },
    scales: {
      x: { type: "linear", min: P.debut * 1000, max: P.fin * 1000, ticks: { color: BRUME, maxTicksLimit: 8, callback: etiquetteDate }, grid: { color: TRAIT } },
      y: { ticks: { color: BRUME, callback: function(v){ return fmt(v, Math.round(v) === v ? 0 : 1) + " " + unite; } }, grid: { color: TRAIT } },
      /* Même échelle répétée à droite, pour lire les valeurs des deux côtés du graphique */
      y2: { position: "right", grid: { drawOnChartArea: false }, ticks: { color: BRUME, callback: function(v){ return fmt(v, Math.round(v) === v ? 0 : 1) + " " + unite; } },
            afterDataLimits: function(ax){ var y = ax.chart.scales.y; if (y) { ax.min = y.min; ax.max = y.max; } } }
    },
    plugins: {
      legend: { labels: { color: BRUME, boxWidth: 12, boxHeight: 3, font: { family: "IBM Plex Mono", size: 12 } } },
      tooltip: { callbacks: {
        title: function(it){ return new Date(it[0].parsed.x).toLocaleString("fr-FR", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); },
        label: function(it){ return it.dataset.label + " : " + fmt(it.parsed.y, unite === "%" || unite === "hPa" ? 0 : 1) + " " + unite; }
      } }
    }
  };
}

/* Mêmes réglages, écrits pour Chart.js 2.9 (navigateur de la télé) */
function options2(unite){
  function graduation(v){ return fmt(v, Math.round(v) === v ? 0 : 1) + " " + unite; }
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    hover: { mode: "nearest", axis: "x", intersect: false },
    elements: { point: { radius: 0, hoverRadius: 4, hitRadius: 6 }, line: { borderWidth: 2, tension: 0.25 } },
    scales: {
      xAxes: [{ type: "linear", ticks: { min: P.debut * 1000, max: P.fin * 1000, fontColor: BRUME, maxTicksLimit: 8, callback: etiquetteDate }, gridLines: { color: TRAIT } }],
      yAxes: [
        { id: "g", position: "left", ticks: { fontColor: BRUME, callback: graduation }, gridLines: { color: TRAIT } },
        { id: "d", position: "right", ticks: { fontColor: BRUME, callback: graduation }, gridLines: { drawOnChartArea: false },
          afterDataLimits: function(ax){ var y = ax.chart.scales.g; if (y) { ax.min = y.min; ax.max = y.max; } } }
      ]
    },
    legend: { labels: { fontColor: BRUME, boxWidth: 12, fontFamily: "IBM Plex Mono", fontSize: 12 } },
    tooltips: { mode: "nearest", axis: "x", intersect: false, callbacks: {
      title: function(it){ return new Date(+it[0].xLabel).toLocaleString("fr-FR", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); },
      label: function(it, data){ return data.datasets[it.datasetIndex].label + " : " + fmt(+it.yLabel, unite === "%" || unite === "hPa" ? 0 : 1) + " " + unite; }
    } }
  };
}

function dessiner(id, jeux, unite){
  if (graphiques[id]) graphiques[id].destroy();
  if (typeof Chart === "undefined") throw new Error("bibliothèque des graphiques non chargée");
  if (!CHART_MODERNE) jeux.forEach(function(j){ j.yAxisID = "g"; if (j.fill === undefined) j.fill = false; j.lineTension = 0.25; });
  graphiques[id] = new Chart(el(id), { type: "line", data: { datasets: jeux }, options: CHART_MODERNE ? options(unite) : options2(unite) });
}

/* ===== Périodes ===== */
function minuit(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function bornes(u, r){
  var a, b;
  if (u === "libre") return plage;
  if (u === "jour") { a = minuit(r); b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 1); }
  else if (u === "semaine") { a = minuit(r); a.setDate(a.getDate() - (a.getDay() + 6) % 7); b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 7); }
  else if (u === "mois") { a = new Date(r.getFullYear(), r.getMonth(), 1); b = new Date(r.getFullYear(), r.getMonth() + 1, 1); }
  else { a = new Date(r.getFullYear(), 0, 1); b = new Date(r.getFullYear() + 1, 0, 1); }
  return { debut: a.getTime() / 1000, fin: b.getTime() / 1000 };
}
function decaler(n){
  if (unite === "libre") {
    var l = plage.fin - plage.debut;
    plage = { debut: plage.debut + n * l, fin: plage.fin + n * l };
    return;
  }
  var r = new Date(ref.getFullYear(), ref.getMonth(), unite === "mois" || unite === "annee" ? 1 : ref.getDate());
  if (unite === "jour") r.setDate(r.getDate() + n);
  else if (unite === "semaine") r.setDate(r.getDate() + 7 * n);
  else if (unite === "mois") r.setMonth(r.getMonth() + n);
  else r.setFullYear(r.getFullYear() + n);
  ref = r;
}
function libelle(){
  var d1 = new Date(P.debut * 1000), d2 = new Date(P.fin * 1000 - 1000), auj = minuit(new Date()).getTime();
  var court = { day: "numeric", month: "short" }, long = { day: "numeric", month: "long", year: "numeric" };
  if (unite === "jour") {
    var t = d1.getTime(), pre = t === auj ? "Aujourd'hui · " : t === auj - 86400000 ? "Hier · " : "";
    return pre + d1.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }
  if (unite === "semaine") return "Semaine du " + d1.toLocaleDateString("fr-FR", d1.getMonth() === d2.getMonth() ? { day: "numeric" } : court) + " au " + d2.toLocaleDateString("fr-FR", long);
  if (unite === "mois") return d1.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  if (unite === "annee") return "Année " + d1.getFullYear();
  return "Du " + d1.toLocaleDateString("fr-FR", long) + " au " + d2.toLocaleDateString("fr-FR", long);
}

function rendre(){
  P = bornes(unite, ref);
  jours = unite === "jour" ? 1 : unite === "semaine" ? 7 : unite === "mois" ? 31 : unite === "annee" ? 365 : Math.max(1, Math.round((P.fin - P.debut) / 86400));
  el("lib").textContent = libelle();
  el("suiv").disabled = P.fin * 1000 > Date.now();
  el("auj").style.display = unite !== "libre" && P.fin * 1000 <= Date.now() ? "" : "none";
  var debut = P.debut;
  var parCapteur = {};
  lignes.mesures.forEach(function(r){ (parCapteur[r.capteur] = parCapteur[r.capteur] || []).push(r); });

  dessiner("g-temp", CAPTEURS.map(function(c){
    return { label: c.nom, borderColor: c.couleur, backgroundColor: c.couleur, data: serie(parCapteur[c.id] || [], "temp", debut) };
  }), "°C");

  var salon = parCapteur[SALON] || [];
  dessiner("g-ext", [{ label: "Température extérieure", borderColor: GIVRE, backgroundColor: "rgba(124,196,232,.12)", fill: true, data: serie(salon, "temp_ext", debut) }], "°C");
  var mm = minMax(salon, "temp_ext", debut);
  el("i-ext").textContent = mm ? "Min " + fmt(mm[0]) + " °C · max " + fmt(mm[1]) + " °C sur la période" : "Pas encore de mesure sur cette période";

  dessiner("g-pres", [{ label: "Pression", borderColor: "#c9d4dc", backgroundColor: "#c9d4dc", data: serie(lignes.pression, "pression_hpa", debut) }], "hPa");
  var mp = minMax(lignes.pression, "pression_hpa", debut);
  el("i-pres").textContent = mp ? "Entre " + fmt(mp[0], 0) + " et " + fmt(mp[1], 0) + " hPa sur la période" : "Pas encore de mesure sur cette période";

  dessiner("g-hum", CAPTEURS.filter(function(c){ return (parCapteur[c.id] || []).some(function(r){ return r.hum !== ""; }); }).map(function(c){
    return { label: c.nom, borderColor: c.couleur, backgroundColor: c.couleur, data: serie(parCapteur[c.id] || [], "hum", debut) };
  }), "%");

  var pas = pasPour(jours);
  el("i-temp").textContent = el("i-hum").textContent = pas ? "Moyenne par " + (pas === 86400 ? "jour" : pas === 3600 ? "heure" : "tranche de 3 h") : "Toutes les mesures";
}

function marquer(u){
  document.querySelectorAll(".periodes button").forEach(function(x){ x.setAttribute("aria-pressed", x.dataset.unite === u ? "true" : "false"); });
}
document.querySelectorAll(".periodes button").forEach(function(b){
  b.addEventListener("click", function(){
    if (b.dataset.unite === "libre") {
      var ouvert = !el("dates").classList.contains("ouvert");
      el("dates").classList.toggle("ouvert", ouvert);
      if (ouvert) { preRemplir(); el("d-du").focus(); }
      return;
    }
    if (unite === "libre") ref = new Date(Math.min(plage.fin * 1000 - 1000, Date.now()));   // garde la position dans le temps
    unite = b.dataset.unite;
    el("dates").classList.remove("ouvert");
    marquer(unite);
    rendre();
  });
});
el("prec").addEventListener("click", function(){ decaler(-1); rendre(); });
el("suiv").addEventListener("click", function(){ decaler(1); rendre(); });
el("auj").addEventListener("click", function(){ ref = new Date(); rendre(); });
/* Flèches gauche / droite du clavier ou de la télécommande quand le focus n'est pas dans un champ */
document.addEventListener("keydown", function(e){
  if (e.target && e.target.tagName === "INPUT") return;
  if (e.keyCode === 37) { e.preventDefault(); decaler(-1); rendre(); }
  else if (e.keyCode === 39 && !el("suiv").disabled) { e.preventDefault(); decaler(1); rendre(); }
});

function iso(d){ return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
/* Accepte AAAA-MM-JJ (champ date) ou JJ/MM/AAAA (navigateurs sans calendrier) */
function lireDate(txt){
  txt = (txt || "").trim();
  var m = txt.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/), a, mo, j;
  if (m) { a = +m[1]; mo = +m[2]; j = +m[3]; }
  else if ((m = txt.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/))) { j = +m[1]; mo = +m[2]; a = +m[3]; if (a < 100) a += 2000; }
  else return null;
  var d = new Date(a, mo - 1, j);
  return d.getMonth() === mo - 1 && d.getDate() === j ? d : null;
}
function versChamp(d){ return el("d-du").type === "date" ? iso(d) : ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2) + "/" + d.getFullYear(); }
function preRemplir(){
  var b = bornes(unite === "libre" ? "libre" : unite, ref);
  el("d-au").max = el("d-du").max = iso(new Date());
  el("d-du").value = versChamp(new Date(b.debut * 1000));
  el("d-au").value = versChamp(new Date(b.fin * 1000 - 1000));
  el("d-err").textContent = "";
}
el("dates").addEventListener("submit", function(e){
  e.preventDefault();
  var du = lireDate(el("d-du").value), au = lireDate(el("d-au").value);
  if (!du || !au) { el("d-err").textContent = "Date incomplète ou invalide (jj/mm/aaaa)."; return; }
