<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maison en direct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Écran de télé, lu à 3 m : colonne gauche heure + extérieur, grille des pièces à droite. Thème sombre unique pour ménager la dalle. */
:root{
  --u:1vw;                 /* secours pour les télés dont le navigateur ne connaît pas min() */
}
@supports (width:min(1vw,1vh)){:root{--u:min(1vw,1.7778vh);}}
:root{
  /* --u : unité qui tient compte de la hauteur : tout rentre aussi sur un écran plus allongé (iPhone à l'horizontale) */
  --nuit:#0f1418;        /* fond */
  --ardoise:#182027;     /* tuiles */
  --trait:#26313a;       /* séparateurs */
  --craie:#e8eef2;       /* texte principal */
  --brume:#8a99a5;       /* texte secondaire */
  --givre:#7cc4e8;       /* accent : froid / extérieur */
  --ok:#7fd1a0; --tiede:#f0c36a; --alerte:#f08a6a;
  --display:"Bricolage Grotesque",system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--nuit);color:var(--craie);font-family:var(--display);overflow:hidden}
.ecran{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.1fr);gap:calc(var(--u)*2.2);padding:calc(var(--u)*2.6) calc(var(--u)*3.4);transition:transform 2s ease}
.gauche{display:flex;flex-direction:column;justify-content:space-between;gap:calc(var(--u)*0.7);min-width:0}
.heure{font-size:calc(var(--u)*4.7);font-weight:600;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
/* Raccourcis vers les autres pages, à droite de l'heure (liste RACCOURCIS en tête du script) */
.entete{display:flex;justify-content:space-between;align-items:flex-start}
.raccourcis{display:flex;flex-direction:column;align-items:stretch;margin-left:calc(var(--u)*1)}
.raccourcis.deux{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:calc(var(--u)*34)}
.raccourcis.deux a{width:calc(50% - var(--u)*0.2);margin-left:calc(var(--u)*0.4)}
.raccourcis a{display:block;font-family:var(--mono);font-size:calc(var(--u)*1.45);color:var(--craie);text-decoration:none;background:var(--ardoise);border:2px solid var(--trait);border-radius:99px;padding:calc(var(--u)*0.55) calc(var(--u)*1.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.raccourcis a+a{margin-top:calc(var(--u)*0.55)}
.raccourcis a:focus,.raccourcis a:hover{border-color:var(--givre);box-shadow:0 0 0 2px var(--givre);outline:none}
.raccourcis a span{color:var(--soleil)}
.raccourcis a .w{display:block;font-size:.75em;padding-left:2.45em;margin-top:.1em}
.date{font-size:calc(var(--u)*1.7);color:var(--brume);margin-top:calc(var(--u)*0.6);text-transform:capitalize}
/* Colonne de gauche en cadres, comme les tuiles des pièces */
.carte{background:var(--ardoise);border-radius:calc(var(--u)*0.9);padding:calc(var(--u)*0.75) calc(var(--u)*1.1)}
.dehors{display:flex;flex-direction:column;gap:calc(var(--u)*0.6)}
.etiquette{font-family:var(--mono);font-size:calc(var(--u)*0.95);letter-spacing:.14em;text-transform:uppercase;color:var(--brume)}
.dehors .ligne{display:flex;align-items:center;gap:calc(var(--u)*1.2);margin-top:calc(var(--u)*0.4)}
.dehors .valeur{font-size:calc(var(--u)*4.1);font-weight:600;color:var(--givre);line-height:1;font-variant-numeric:tabular-nums}
.dehors .ciel-act{display:flex;flex:0 1 auto;min-width:0;overflow:hidden;line-height:1;text-align:center}
.dehors .ciel-act div+div{margin-left:calc(var(--u)*0.6)}
.dehors .ciel-act b{display:block;font-size:calc(var(--u)*2.2);font-weight:400}
.dehors .ciel-act span{display:block;margin-top:calc(var(--u)*0.3);font-family:var(--mono);font-size:calc(var(--u)*0.75);color:var(--brume);white-space:nowrap}
.emo{font-style:normal;margin-right:.35em}
.dehors .valeur small{font-size:.45em;font-weight:400;margin-left:.1em}
.dehors .hum{margin-left:auto;text-align:right;line-height:1.15;font-size:calc(var(--u)*1.7);font-variant-numeric:tabular-nums;color:var(--craie)}
.dehors .hum span{display:block;font-family:var(--mono);font-size:.5em;letter-spacing:.12em;text-transform:uppercase;color:var(--brume)}
.pression{font-size:calc(var(--u)*1.5);color:var(--brume);margin-top:calc(var(--u)*0.5);font-variant-numeric:tabular-nums}
.pression b{color:var(--craie);font-weight:600}
.pluie{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:calc(var(--u)*1)}
.pluie .resume{font-size:calc(var(--u)*1.4);color:var(--craie);line-height:1.2;padding-bottom:calc(var(--u)*1.1)}   /* recentre le texte sur les barres, sans les heures dessous */
.pluie .resume span{display:block;font-family:var(--mono);font-size:.55em;letter-spacing:.05em;text-transform:uppercase;color:var(--brume);margin-bottom:calc(var(--u)*0.3)}
.pluie .barres{display:flex;gap:calc(var(--u)*0.5);align-items:flex-end}
.pluie .q{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*0.3)}
.pluie .b{width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);border-radius:calc(var(--u)*0.3);background:var(--nuit);border:1px solid var(--trait);display:flex;align-items:flex-end;overflow:hidden}
.pluie .b i{display:block;width:100%}
.pluie .b i.sec{height:calc(var(--u)*0.25)!important;background:var(--brume)!important;opacity:.5}
.pluie .h{font-family:var(--mono);font-size:calc(var(--u)*0.75);color:var(--brume)}
.tendance{margin-top:calc(var(--u)*0.8)}
.dehors .carte .pression{margin-top:0}
.tendance svg{display:block;width:100%;height:calc(var(--u)*2.6);overflow:visible}
.tendance .graphe{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:calc(var(--u)*0.6);align-items:stretch}
.tendance .echelle{display:flex;flex-direction:column;justify-content:space-between;font-family:var(--mono);font-size:calc(var(--u)*0.8);color:var(--brume);line-height:1;font-variant-numeric:tabular-nums}
.tendance .echelle.g{text-align:right}
.tendance .axe{display:flex;justify-content:space-between;font-family:var(--mono);font-size:calc(var(--u)*0.8);color:var(--brume);margin-top:calc(var(--u)*0.6)}

.jours{display:flex;flex-direction:column;gap:calc(var(--u)*0.12);margin-top:calc(var(--u)*0.35)}
.jour{display:grid;grid-template-columns:calc(var(--u)*4.2) minmax(0,1fr);align-items:center;gap:0 calc(var(--u)*0.8);font-size:calc(var(--u)*1.15);line-height:1.25}
.jour .j{color:var(--brume);text-transform:capitalize}
/* Évolution du temps dans la journée : un emoji par créneau (HEURES_JOUR) */
.jour .tps{display:flex;align-items:center;font-size:1.05em;line-height:1;background:rgba(255,255,255,.05);border:1px solid var(--trait);border-radius:calc(var(--u)*0.5);padding:calc(var(--u)*0.03) 0}
.jour .tps i{font-style:normal;flex:1 1 0;width:20%;min-width:0;text-align:center;overflow:hidden}
.jour .tps i.passe{opacity:.35}
.jour.heures{font-family:var(--mono);font-size:calc(var(--u)*0.7);line-height:.8;color:var(--brume)}
.jour.heures .tps{font-size:1em;background:none;border-color:transparent;padding:0}
.jour .tps b{flex:none;font-weight:400;font-size:.95em;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.jour .tps .mn{width:calc(var(--u)*2.3);color:var(--brume)}
.jour .tps .mx{width:calc(var(--u)*2.6)}
.jour .tps .pl{width:calc(var(--u)*3.6);padding-right:calc(var(--u)*0.4);color:var(--givre);font-family:var(--mono);font-size:.7em}
.jour.heures .tps b{font-size:1em}
.jour.heures .tps .pl{font-size:1.3em}
.etat{font-family:var(--mono);font-size:calc(var(--u)*0.9);color:var(--brume)}
.etat.erreur{color:var(--alerte)}
.pieces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:calc(var(--u)*1.2);min-width:0}
.piece{background:var(--ardoise);border-radius:calc(var(--u)*1);padding:calc(var(--u)*1.4) calc(var(--u)*1.6);display:flex;flex-direction:column;justify-content:space-between;gap:calc(var(--u)*0.6);position:relative;min-width:0}
.piece.principale{grid-column:span 2}
.piece h2{margin:0;font-size:calc(var(--u)*1.45);font-weight:600;line-height:1.15}
.temp{font-size:calc(var(--u)*4);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.principale .temp{font-size:calc(var(--u)*5.6)}
.temp small{font-size:.45em;font-weight:400;color:var(--brume);margin-left:.08em}
.bas{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*0.8);flex-wrap:wrap}
.pastille{font-family:var(--mono);font-size:calc(var(--u)*0.95);padding:calc(var(--u)*0.25) calc(var(--u)*0.7);border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.p-froid{color:var(--givre)} .p-ok{color:var(--ok)} .p-tiede{color:var(--tiede)} .p-alerte{color:var(--alerte)} .p-gris{color:var(--brume)}
.humid{font-size:calc(var(--u)*1.5);color:var(--craie);font-variant-numeric:tabular-nums}
.humid span{color:var(--brume);font-size:.75em}
.maj{font-family:var(--mono);font-size:calc(var(--u)*0.85);color:var(--brume)}
/* Volet roulant qui couvre toute la partie intérieure ; fermé par défaut */
.zone{position:relative;min-width:0;overflow:hidden;border-radius:calc(var(--u)*1)}
.zone .pieces{height:100%}
.volet{position:absolute;top:0;right:0;bottom:0;left:0;   /* pas de inset : inconnu des navigateurs des télés Samsung avant 2022 */
  z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1);
  border-radius:calc(var(--u)*1);cursor:pointer;color:var(--craie);text-align:center;
  background:repeating-linear-gradient(180deg,#1b242c 0,#1b242c calc(var(--u)*3.4),#141b21 calc(var(--u)*3.4),#141b21 calc(var(--u)*3.6));
  transition:transform .8s cubic-bezier(.6,0,.3,1),visibility 0s linear 0s}
.volet .grand{font-size:calc(var(--u)*6);line-height:1}
/* Prévisions à 15 jours affichées sur le volet fermé */
.volet.p15{justify-content:flex-start;align-items:stretch;text-align:left;padding:calc(var(--u)*1.8) calc(var(--u)*1.8) calc(var(--u)*2.6)}
.p15 .entete{display:flex;justify-content:space-between;align-items:baseline;gap:calc(var(--u)*1);margin-bottom:calc(var(--u)*1.2)}
.p15 .entete b{font-size:calc(var(--u)*1.9);font-weight:600}
.p15 .entete span{font-family:var(--mono);font-size:calc(var(--u)*0.95);letter-spacing:.12em;text-transform:uppercase;color:var(--brume)}
.p15 .grille{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:calc(var(--u)*0.9)}
.p15 .jc{background:rgba(15,20,24,.72);border:1px solid var(--trait);border-radius:calc(var(--u)*0.8);padding:calc(var(--u)*0.9) calc(var(--u)*0.7);display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.p15 .jc.loin{opacity:.6}
.p15 .jc .d{font-size:calc(var(--u)*1.25);color:var(--brume);text-transform:capitalize;white-space:nowrap}
.p15 .jc .d b{color:var(--craie);font-weight:600}
.p15 .jc .e{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center;line-height:1}
.p15 .jc .e b{display:block;font-size:calc(var(--u)*2.1);font-weight:400}
.p15 .jc .e span{display:block;margin-top:calc(var(--u)*0.2);font-family:var(--mono);font-size:calc(var(--u)*0.65);color:var(--brume)}
.p15 .jc .c{font-size:calc(var(--u)*1.05);color:var(--brume);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p15 .jc .c i{font-style:normal;font-family:var(--mono);font-size:.9em;color:var(--givre);margin-left:.4em}
.p15 .jc .t4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(var(--u)*0.35);text-align:center}
.p15 .jc .t4 span{display:block;font-family:var(--mono);font-size:calc(var(--u)*0.68);color:var(--brume);letter-spacing:.04em}
.p15 .jc .t4 .bar{height:calc(var(--u)*2.6);display:flex;align-items:flex-end;justify-content:center;margin-bottom:calc(var(--u)*0.3)}
.p15 .jc .t4 .bar i{display:block;width:58%;border-radius:calc(var(--u)*0.25) calc(var(--u)*0.25) 0 0;min-height:3px}
.p15 .jc .t4 b{display:block;font-size:calc(var(--u)*1.15);font-weight:600;font-variant-numeric:tabular-nums}
.volet .titre{font-size:calc(var(--u)*2.6);font-weight:600}
.volet .aide{font-family:var(--mono);font-size:calc(var(--u)*1);letter-spacing:.12em;text-transform:uppercase;color:var(--brume)}
.volet .poignee{position:absolute;bottom:calc(var(--u)*1.2);width:calc(var(--u)*8);height:calc(var(--u)*0.5);border-radius:99px;background:var(--trait)}
.ouvert .volet{transform:translateY(-101%);visibility:hidden;transition:transform .8s cubic-bezier(.6,0,.3,1),visibility 0s linear .8s}
.ferme .pieces{visibility:hidden}
.bascule{align-self:flex-start;font-family:var(--mono);font-size:calc(var(--u)*0.95);padding:calc(var(--u)*0.4) calc(var(--u)*1.1);border-radius:99px;border:1px solid var(--trait);background:var(--ardoise);color:var(--craie);cursor:pointer}
.bascule:hover{border-color:var(--givre)}
.pied{display:flex;justify-content:space-between;gap:calc(var(--u)*0.6);flex-wrap:wrap}
.ciel-tuile{position:absolute;top:calc(var(--u)*1.1);right:calc(var(--u)*1.3);display:flex;text-align:center;line-height:1}
.ciel-tuile div+div{margin-left:calc(var(--u)*1)}
.ciel-tuile b{display:block;font-size:calc(var(--u)*2.4);font-weight:400}
.ciel-tuile span{display:block;margin-top:calc(var(--u)*0.3);font-family:var(--mono);font-size:calc(var(--u)*0.8);color:var(--brume)}
.pile{font-family:var(--mono);font-size:calc(var(--u)*0.85);color:var(--alerte)}
@media (max-width:800px){
  body{overflow:auto}
  .ecran{grid-template-columns:1fr;height:auto;padding:16px}
  .heure{font-size:18vw}.date{font-size:5vw}.dehors .valeur{font-size:14vw}.dehors .hum{font-size:5vw}
  .pieces{grid-template-columns:1fr 1fr}.piece{padding:14px}.piece h2{font-size:4.5vw}.temp,.principale .temp{font-size:11vw}
  .raccourcis a{font-size:4.2vw;padding:2vw 4vw}
  .etiquette,.pastille,.maj,.etat,.pile,.bascule{font-size:3vw}.pression{font-size:3.6vw}.pluie .resume{font-size:4vw}.pluie .b{width:8vw;height:10vw}.pluie .h{font-size:2.6vw}.p15 .grille{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:none}.p15 .jc .d,.p15 .jc .c{font-size:3.2vw}.p15 .jc .t4 b{font-size:4vw}.p15 .jc .t4 .bar{height:8vw}.p15 .jc .t4 span{font-size:2.4vw}.p15 .jc .e b{font-size:6vw}.p15 .jc .e span{font-size:2.2vw}.p15 .entete b{font-size:5vw}.p15 .entete span{font-size:2.6vw}.tendance svg{height:14vw}.tendance .echelle{font-size:2.6vw}.tendance .axe{font-size:2.6vw}.jour{font-size:4vw;grid-template-columns:11vw minmax(0,1fr)}.jour .tps .mn{width:7vw}.jour .tps .mx{width:8vw}.jour .tps .pl{width:11vw}.jour.heures{font-size:2.6vw}.dehors .ciel-act b{font-size:8vw}.dehors .ciel-act span{font-size:2.4vw}.humid{font-size:4vw}.ciel-tuile{top:12px;right:12px}.ciel-tuile b{font-size:6vw}.ciel-tuile span{font-size:2.4vw}
}
/* Tuiles teintées selon le confort : chiffre en couleur, bordure et fond légèrement colorés, pastille pleine */
.piece{border-left:calc(var(--u)*0.3) solid var(--c,var(--trait));background:linear-gradient(135deg,var(--fond,var(--ardoise)) 0%,var(--ardoise) 75%)}
.piece .temp{color:var(--c,var(--craie))}
.piece .pastille{background:var(--c,transparent);border-color:var(--c,currentColor);color:var(--nuit);font-weight:500}
.piece .pastille.p-gris{background:transparent;color:var(--brume)}
.piece.e-froid{--c:var(--givre);--fond:#173447}
.piece.e-ok{--c:var(--ok);--fond:#173a2a}
.piece.e-tiede{--c:var(--tiede);--fond:#3d3218}
.piece.e-alerte{--c:var(--alerte);--fond:#43231a}
.piece.vieux{opacity:.7}
/* Téléphone : bordure d'épaisseur fixe, sinon trop fine */
@media (max-width:800px),(max-height:500px) and (orientation:landscape){.piece{border-left-width:4px}}
@media (prefers-reduced-motion:reduce){.ecran,.volet{transition:none!important}}
/* ===== Télés anciennes (Samsung 2018…) : navigateur sans grille CSS ni « gap » en flexbox.
   Même mise en page refaite en flexbox, avec des marges à la place des « gap ». Ignoré par les navigateurs récents. ===== */
@supports not (display:grid){
  .ecran{display:flex;align-items:stretch}
  .gauche{flex:1 1 0%;width:0}
  .zone{flex:2.1 1 0%;width:0;margin-left:calc(var(--u)*2.2)}
  .gauche>*{flex-shrink:0}   /* sinon les cadres s'écrasent et se chevauchent */
  .gauche>*+*{margin-top:calc(var(--u)*0.7)}
  .dehors>*+*{margin-top:calc(var(--u)*0.6)}
  .dehors .ligne>*+*{margin-left:calc(var(--u)*1.2)}
  .dehors .ligne .hum{margin-left:auto}
  .pluie{display:flex;align-items:center;justify-content:space-between}
  .pluie .resume{flex:1 1 auto;min-width:0;margin-right:calc(var(--u)*1)}
  .pluie .q+.q{margin-left:calc(var(--u)*0.5)}
  .pluie .q>*+*{margin-top:calc(var(--u)*0.3)}
  .tendance .graphe{display:flex;align-items:stretch}
  .tendance .graphe>div:nth-child(2){flex:1 1 auto;min-width:0;margin:0 calc(var(--u)*0.6)}
  .jours>*+*{margin-top:calc(var(--u)*0.15)}
  .jour{display:flex;align-items:baseline}
  .jour .j{flex:none;width:calc(var(--u)*4.6)}
  .jour .tps{flex:1 1 auto;min-width:0;margin:0 calc(var(--u)*0.8)}
  .jour .tps i{width:20%}
  /* Pièces : 4 par ligne, le salon compte double, sur 2 lignes qui remplissent la hauteur */
  .zone .pieces{position:absolute;top:0;right:0;bottom:0;left:0;height:auto;display:flex;flex-wrap:wrap;align-content:stretch;margin:calc(var(--u)*-0.6)}
  .piece{width:calc(25% - var(--u)*1.2);height:calc(50% - var(--u)*1.2);margin:calc(var(--u)*0.6)}
  .piece.principale{width:calc(50% - var(--u)*1.2)}
  .bas>*+*,.pied>*+*{margin-left:calc(var(--u)*0.8)}
  .volet:not(.p15)>*+*{margin-top:calc(var(--u)*1)}
  /* Volet : 15 jours en 5 colonnes × 3 lignes */
  .p15 .grille{display:flex;flex-wrap:wrap;align-content:stretch;margin:calc(var(--u)*-0.45)}
  .p15 .jc{width:calc(20% - var(--u)*0.9);margin:calc(var(--u)*0.45)}
  .p15 .jc .t4{display:flex}
  .p15 .jc .t4>div{flex:1 1 0%;min-width:0}
  .p15 .jc .t4>div+div{margin-left:calc(var(--u)*0.35)}
}
</style>
<script src="verrou.js"></script>
</head>
<body>
<main class="ecran" id="ecran">
  <section class="gauche">
    <div class="entete">
      <div>
        <div class="heure" id="heure">--:--</div>
        <div class="date" id="date"></div>
      </div>
      <nav class="raccourcis" id="raccourcis" aria-label="Autres pages"></nav>
    </div>
    <div class="dehors">
      <div class="carte">
        <div class="etiquette"><i class="emo">🌳</i>Dehors</div>

  CAPTEURS.forEach(function(c){

function lireJson(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }

/* ===== Météo (Open-Meteo, gratuit, sans clé) ===== */
function emoji(code, jour){
  if (code === 0) return jour === false ? "🌙" : "☀️";
  if (code === 1) return jour === false ? "🌙" : "🌤️";
  if (code === 2) return jour === false ? "☁️" : "⛅";

  if (code >= 51 && code <= 57) return "🌦️";

  if (code >= 71 && code <= 77) return "❄️";
  if (code >= 80 && code <= 82) return "🌦️";

  if (code >= 95) return "⛈️";

}
function ciel(code){
  if (code === 0) return "Ensoleillé";

  if (code === 3) return "Couvert";
  if (code === 45 || code === 48) return "Brouillard";

  if (code >= 61 && code <= 67) return "Pluie";
  if (code >= 71 && code <= 77) return "Neige";
  if (code >= 80 && code <= 82) return "Averses";
  if (code === 85 || code === 86) return "Averses de neige";
  if (code >= 95) return "Orage";
  return "—";
}

  z.innerHTML = html;
}
/* Courbe de la pression d'aujourd'hui (0 h à 24 h) : passé en trait plein, prévision en pointillés */
function courbePression(m){
  var jour = m.current.time.slice(0, 10), h = m.hourly, pts = [];
  for (var i = 0; i < h.time.length; i++) {
    if (h.time[i].slice(0, 10) === jour && typeof h.pressure_msl[i] === "number") {
      pts.push({ x: +h.time[i].slice(11, 13), y: h.pressure_msl[i] });
    }
  }
  if (pts.length < 2) { el("tendance").innerHTML = ""; return; }
  var ys = pts.map(function(p){ return p.y; });
  var mini = Math.min.apply(null, ys), maxi = Math.max.apply(null, ys);
  var milieu = (mini + maxi) / 2, ecart = Math.max(maxi - mini, 4);   // au moins 4 hPa d'amplitude pour ne pas exagérer
  var bas = milieu - ecart / 2, haut = milieu + ecart / 2;
  var L = 240, H = 50;
  function X(x){ return (x / 23 * L).toFixed(1); }
  function Y(y){ return (H - (y - bas) / (haut - bas) * H).toFixed(1); }
  var maint = new Date(m.current.time), hx = maint.getHours() + maint.getMinutes() / 60;
  var passe = pts.filter(function(p){ return p.x <= Math.ceil(hx); });
  var futur = pts.filter(function(p){ return p.x >= Math.floor(hx); });
  function trace(liste){ return liste.map(function(p, k){ return (k ? "L" : "M") + X(p.x) + " " + Y(p.y); }).join(" "); }
  /* valeur à l'heure actuelle, interpolée */
  var a = pts[0], b = pts[pts.length - 1];
  for (var k = 0; k < pts.length - 1; k++) if (pts[k].x <= hx && pts[k + 1].x >= hx) { a = pts[k]; b = pts[k + 1]; break; }
  var yn = a.x === b.x ? a.y : a.y + (b.y - a.y) * (hx - a.x) / (b.x - a.x);
  var svg = '<svg viewBox="0 0 ' + L + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Pression aujourd\'hui, de ' + Math.round(mini) + ' à ' + Math.round(maxi) + ' hPa">' +
    '<line x1="0" x2="' + L + '" y1="' + Y(milieu) + '" y2="' + Y(milieu) + '" stroke="var(--trait)" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
    (passe.length > 1 ? '<path d="' + trace(passe) + '" fill="none" stroke="var(--givre)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' : '') +
    (futur.length > 1 ? '<path d="' + trace(futur) + '" fill="none" stroke="var(--givre)" stroke-width="2" stroke-dasharray="4 4" opacity=".55" vector-effect="non-scaling-stroke"/>' : '') +
    '</svg>';
  var ech = '<span>' + Math.round(haut) + '</span><span>' + Math.round(milieu) + '</span><span>' + Math.round(bas) + '</span>';
  el("tendance").innerHTML = '<div class="graphe"><div class="echelle g">' + ech + '</div>' +
    '<div style="position:relative">' + svg +
    '<span style="position:absolute;left:' + (hx / 23 * 100).toFixed(1) + '%;top:' + (Y(yn) / H * 100).toFixed(1) + '%;width:calc(var(--u)*0.8);height:calc(var(--u)*0.8);min-width:8px;min-height:8px;border-radius:50%;background:var(--craie);transform:translate(-50%,-50%)"></span></div>' +
    '<div class="echelle">' + ech + '</div></div>' +
    '<div class="axe"><span>0 h</span><span>hPa · min ' + Math.round(mini) + ' · max ' + Math.round(maxi) + '</span><span>24 h</span></div>';
}
/* Pluie dans l'heure : 4 quarts d'heure, bâtonnets plus hauts et plus sombres quand la pluie est plus forte */
var NIVEAUX_PLUIE = [   // millimètres sur le quart d'heure
  { max: 0.05, nom: "",           couleur: "" },
  { max: 0.25, nom: "faible",     couleur: "#bfe3f7" },
  { max: 0.75, nom: "modérée",    couleur: "#6fb6ea" },
  { max: 2,    nom: "forte",      couleur: "#2f7fd6" },
  { max: 1e9,  nom: "très forte", couleur: "#1c4fb0" }
];
function niveauPluie(mm){ for (var n = 0; n < NIVEAUX_PLUIE.length; n++) if (mm < NIVEAUX_PLUIE[n].max) return n; return NIVEAUX_PLUIE.length - 1; }
function pluieHeure(m){
  var q = m.minutely_15;
  if (!q || !q.time) { el("pluie").innerHTML = ""; return; }
  var debut = 0;
  while (debut < q.time.length - 1 && q.time[debut + 1] <= m.current.time) debut++;   // quart d'heure en cours
  var barres = "", premier = -1, pire = 0;
  for (var k = debut; k < debut + 4 && k < q.time.length; k++) {
    var mm = q.precipitation[k] || 0, n = niveauPluie(mm);
    if (n > 0 && premier < 0) premier = k;
    pire = Math.max(pire, n);
    var haut = n === 0 ? 0 : 25 + n * 18.75;   // 25 % à 100 % selon l'intensité
    barres += '<div class="q"><div class="b" title="' + mm.toFixed(1).replace(".", ",") + ' mm"><i' + (n === 0 ? ' class="sec"' : '') + ' style="height:' + haut + '%;background:' + NIVEAUX_PLUIE[n].couleur + '"></i></div>' +
      '<span class="h">' + q.time[k].slice(11, 16).replace(":", "h") + '</span></div>';
  }
  var resume, titre = "Dans l'heure";
  if (premier < 0) resume = "🌂 Pas de pluie";
  else {
    resume = premier === debut ? "☔ Pluie en cours" : "☔ Pluie vers " + q.time[premier].slice(11, 16).replace(":", "h");
    titre += " · " + (pire > 1 ? "jusqu'à " : "") + NIVEAUX_PLUIE[pire].nom;
  }
  el("pluie").innerHTML = '<div class="resume"><span>' + titre + '</span>' + resume + '</div><div class="barres">' + barres + '</div>';
}
/* Volet fermé : prévisions sur 15 jours (au-delà de 10 jours, simple tendance, affichée plus pâle) */
var MOMENTS = [ ["Mat.", 0, 8], ["Midi", 0, 13], ["Soir", 0, 19], ["Nuit", 1, 2] ];   // [libellé, décalage en jours, heure]
function previsions15(m){
  var dj = m.daily, auj = Math.max(0, dj.time.indexOf(m.current.time.slice(0, 10))), html = "";
  var h = m.hourly, idx = {};
  for (var i = 0; i < h.time.length; i++) idx[h.time[i]] = i;
  function tempA(jour, decal, heure){
    var d = new Date(jour + "T12:00"); d.setDate(d.getDate() + decal);
    var cle = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2) + "T" + ("0" + heure).slice(-2) + ":00";
    var t = h.temperature_2m && idx[cle] !== undefined ? h.temperature_2m[idx[cle]] : null;
    return typeof t === "number" ? t : null;
  }
  /* Toutes les températures d'abord, pour une échelle commune aux 15 jours */
  var tableau = [], tous = [];
  for (var j = auj; j < dj.time.length && j < auj + 15; j++) {
    var ligne = MOMENTS.map(function(mo){ return tempA(dj.time[j], mo[1], mo[2]); });
    tableau.push(ligne);
    ligne.forEach(function(t){ if (t !== null) tous.push(t); });
  }
  var tMin = Math.min.apply(null, tous), tMax = Math.max.apply(null, tous);
  if (!(tMax - tMin >= 6)) { var c = (tMin + tMax) / 2 || 0; tMin = c - 3; tMax = c + 3; }   // évite d'exagérer de petits écarts
  function couleurT(t){ return t < 0 ? "#a9d8f5" : t < 6 ? "#7cc4e8" : t < 12 ? "#7fd1c0" : t < 18 ? "#f0c36a" : t < 25 ? "#f0a46a" : "#f08a6a"; }
  function colonne(lib, t){
    if (t === null) return '<div><div class="bar"></div><b>–</b><span>' + lib + '</span></div>';
    var haut = 15 + (t - tMin) / (tMax - tMin) * 85;
    return '<div><div class="bar"><i style="height:' + haut.toFixed(0) + '%;background:' + couleurT(t) + '"></i></div><b>' + Math.round(t) + '°</b><span>' + lib + '</span></div>';
  }
  for (var k = auj; k < dj.time.length && k < auj + 15; k++) {
    var d = new Date(dj.time[k] + "T12:00"), n = k - auj;
    var nom = n === 0 ? "Auj." : n === 1 ? "Demain" : d.toLocaleDateString("fr-FR", { weekday: "short" });
    var pl = dj.precipitation_probability_max[k];
    html += '<div class="jc' + (n >= 10 ? " loin" : "") + '">' +
      '<div class="d">' + nom + ' <b>' + d.getDate() + '</b></div>' +
      '<div class="e">' + [["Matin", 8], ["Midi", 13], ["Soir", 19]].map(function(mo){
        var x = idx[dj.time[k] + "T" + ("0" + mo[1]).slice(-2) + ":00"], c = x !== undefined ? h.weather_code[x] : null;
        return '<div><b>' + (typeof c === "number" ? emoji(c, !h.is_day || h.is_day[x] !== 0) : "·") + '</b><span>' + mo[0] + '</span></div>';
      }).join("") + '</div>' +
      '<div class="c">' + ciel(dj.weather_code[k]) + (typeof pl === "number" && pl >= 20 ? '<i>☔' + pl + '%</i>' : '') + '</div>' +
      '<div class="t4">' + MOMENTS.map(function(mo, x){ return colonne(mo[0], tableau[n][x]); }).join("") + '</div></div>';
  }
  var v = el("volet");
  v.classList.add("p15");
  v.innerHTML = '<div class="entete"><b>📅 Prévisions sur 15 jours</b><span>🏠 Toucher pour afficher l\'intérieur</span></div>' +
    '<div class="grille">' + html + '</div><div class="poignee" style="align-self:center"></div>';
}
/* Remplace, partout où Météo-France a une valeur, les données du modèle par défaut (au-delà de 4 jours, rien ne change) */
function fusionMeteoFrance(m, mf){
  if (!mf) return m;
  function remplace(dest, src, champs){
    if (!dest || !src || !src.time) return;
    var pos = {};
    for (var i = 0; i < dest.time.length; i++) pos[dest.time[i]] = i;
    champs.forEach(function(c){
      if (!dest[c] || !src[c]) return;
      for (var j = 0; j < src.time.length; j++) {
        var k = pos[src.time[j]];
        if (k !== undefined && typeof src[c][j] === "number") dest[c][k] = src[c][j];
      }
    });
  }
  remplace(m.hourly, mf.hourly, ["temperature_2m", "weather_code", "is_day"]);
  remplace(m.minutely_15, mf.minutely_15, ["precipitation"]);
  /* Jours : seulement ceux que Météo-France couvre en entier (24 heures), sinon min/max seraient faussés */
  if (mf.daily && mf.hourly && m.daily) {
    var complets = { time: [], weather_code: [], temperature_2m_max: [], temperature_2m_min: [] };
    mf.daily.time.forEach(function(jour, d){
      var n = 0;
      for (var i = 0; i < mf.hourly.time.length; i++)
        if (mf.hourly.time[i].slice(0, 10) === jour && typeof mf.hourly.temperature_2m[i] === "number") n++;
      if (n < 24) return;
      complets.time.push(jour);
      complets.weather_code.push(mf.daily.weather_code[d]);
      complets.temperature_2m_max.push(mf.daily.temperature_2m_max[d]);
      complets.temperature_2m_min.push(mf.daily.temperature_2m_min[d]);
    });
    remplace(m.daily, complets, ["weather_code", "temperature_2m_max", "temperature_2m_min"]);
  }
  if (mf.current && typeof mf.current.weather_code === "number") {
    m.current.weather_code = mf.current.weather_code;
    if (typeof mf.current.is_day === "number") m.current.is_day = mf.current.is_day;
  }
  return m;
}
function meteo(){
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + LIEU.lat + "&longitude=" + LIEU.lon +
    "&current=pressure_msl,weather_code,is_day&minutely_15=precipitation&hourly=pressure_msl,temperature_2m,weather_code,is_day&past_days=1&forecast_days=16" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FParis";
  /* Modèles Météo-France (AROME 1,5 km puis ARPEGE) pour les 4 premiers jours : plus fidèles que le modèle par défaut */
  var urlMF = "https://api.open-meteo.com/v1/forecast?latitude=" + LIEU.lat + "&longitude=" + LIEU.lon +
    "&current=weather_code,is_day&minutely_15=precipitation&hourly=temperature_2m,weather_code,is_day&past_days=1&forecast_days=4" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min&models=meteofrance_seamless&timezone=Europe%2FParis";
  Promise.all([
    fetch(url).then(lireJson),
    fetch(urlMF).then(lireJson).catch(function(){ return null; })   // si Météo-France ne répond pas, on garde le modèle par défaut
  ]).then(function(r){
    var m = fusionMeteoFrance(r[0], r[1]);
    /* Pression et tendance sur 3 h */
    var p = m.current && m.current.pressure_msl;
    if (typeof p === "number") {
      var heures = m.hourly.time, i = heures.indexOf(m.current.time.slice(0, 13) + ":00"), tendance = "";
      if (i >= 3) {
        var d = p - m.hourly.pressure_msl[i - 3];
        tendance = d >= 1 ? " ↗ en hausse" : d <= -1 ? " ↘ en baisse" : " → stable";
      }
      el("pression").innerHTML = '<i class="emo">🧭</i>Pression <b>' + Math.round(p) + " hPa</b>" + tendance;
    }
    courbePression(m);
    previsions15(m);
    pluieHeure(m);
    if (typeof m.current.weather_code === "number") el("ciel-act").innerHTML = cielProchain(m);
    cielTuileDehors(m);
    /* Aujourd'hui + les jours suivants */
    var dj = m.daily, auj = Math.max(0, dj.time.indexOf(m.current.time.slice(0, 10)));
    var hh = m.hourly, maint = m.current.time.slice(0, 13);
    var html = '<div class="jour heures"><span class="j"></span><span class="tps">' +
      HEURES_JOUR.map(function(x){ return '<i>' + x + 'h</i>'; }).join("") +
      '<b class="mn">min</b><b class="mx">max</b><b class="pl">☔</b></span></div>';
    for (var k = auj; k < dj.time.length && k < auj + JOURS_PREVISION; k++) {
      var nom = k === auj ? "Auj." : new Date(dj.time[k] + "T12:00").toLocaleDateString("fr-FR", { weekday: "short" });
      var pl = dj.precipitation_probability_max[k];
      var tps = HEURES_JOUR.map(function(x){
        var t = dj.time[k] + "T" + (x < 10 ? "0" : "") + x + ":00", i = hh.time.indexOf(t);
        var c = i >= 0 ? hh.weather_code[i] : null;
        if (typeof c !== "number") return '<i>·</i>';
        var e = emoji(c, !hh.is_day || hh.is_day[i] !== 0);
        return '<i' + (t.slice(0, 13) < maint ? ' class="passe"' : '') + ' title="' + x + ' h : ' + ciel(c) + '">' + e + '</i>';
      }).join("");
      html += '<div class="jour"><span class="j">' + nom + '</span><span class="tps">' + tps +
        '<b class="mn">' + Math.round(dj.temperature_2m_min[k]) + '°</b><b class="mx">' + Math.round(dj.temperature_2m_max[k]) + '°</b>' +
        '<b class="pl">' + (pl >= 20 ? pl + '%' : '') + '</b></span></div>';
    }
    el("jours").innerHTML = html;
  }).catch(function(){
    el("jours").innerHTML = '<div class="maj">Prévisions indisponibles, nouvel essai dans 15 min.</div>';
  });
}

/* Léger décalage périodique pour éviter le marquage de l'écran */
var decalages = [[0,0],[6,4],[-5,6],[4,-5],[-6,-3]], iDec = 0;
function decaler(){
  iDec = (iDec + 1) % decalages.length;
  el("ecran").style.transform = "translate(" + decalages[iDec][0] + "px," + decalages[iDec][1] + "px)";
}

/* Volet de la partie intérieure : fermé à chaque ouverture de la page */
var minuteurVolet = null, decompte = null, finVolet = 0;
function texteBouton(){
  var reste = Math.max(0, Math.ceil((finVolet - Date.now()) / 1000));
  el("bascule").textContent = "🔽 Fermer le volet · " + Math.floor(reste / 60) + ":" + ("0" + reste % 60).slice(-2);
  if (reste <= 0) volet(false);
}
function volet(ouvrir){
  var z = el("zone");
  clearTimeout(minuteurVolet); clearInterval(decompte);
  if (ouvrir) {
    z.classList.remove("ferme"); z.classList.add("ouvert");
  } else {
    z.classList.remove("ouvert");
    minuteurVolet = setTimeout(function(){ z.classList.add("ferme"); }, 800);   // on cache les tuiles une fois le volet redescendu
  }
  var b = el("bascule");
  if (ouvrir) { finVolet = Date.now() + VOLET_MIN * 60 * 1000; texteBouton(); decompte = setInterval(texteBouton, 1000); }
  else b.textContent = "🏠 Ouvrir le volet";
  b.setAttribute("aria-pressed", ouvrir ? "true" : "false");
}
function voletOuvert(){ return el("zone").classList.contains("ouvert"); }
el("bascule").addEventListener("click", function(){ volet(!voletOuvert()); });
el("volet").addEventListener("click", function(){ volet(true); });
el("volet").addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); volet(true); } });
el("pieces").addEventListener("click", function(){ volet(false); });
/* Retour sur l'onglet après une mise en veille : le minuteur peut avoir été suspendu, on le vérifie tout de suite */
document.addEventListener("visibilitychange", function(){ if (!document.hidden && voletOuvert()) texteBouton(); });

/* La page ne se recharge pas d'elle-même : on vérifie toutes les 5 min si une nouvelle version a été publiée,
   et on recharge (le volet se referme, le code d'accès reste retenu). */
var versionChargee = null;
function versionPage(){
  return Promise.all(["index.html", "verrou.js"].map(function(f){
    return fetch(f + "?v=" + Date.now(), { cache: "no-store" }).then(function(r){ if (!r.ok) throw new Error(); return r.text(); });
  })).then(function(t){
    var txt = t.join(""), h = 0;
    for (var i = 0; i < txt.length; i++) h = (h * 31 + txt.charCodeAt(i)) | 0;   // empreinte simple du contenu
    return txt.length + ":" + h;
  });
}
versionPage().then(function(v){ versionChargee = v; }).catch(function(){});
setInterval(function(){
  versionPage().then(function(v){
    if (versionChargee === null) { versionChargee = v; return; }
    if (v !== versionChargee) location.reload();
  }).catch(function(){});
}, 5 * 60 * 1000);

/* Raccourcis, et production solaire en direct sur celui de la page Énergie */
document.getElementById("raccourcis").innerHTML = RACCOURCIS.map(function(r){
  return '<a href="' + r.lien + '"' + (r.id ? ' id="' + r.id + '"' : '') + '>' + r.texte + '</a>';
}).join("");
if (RACCOURCIS.length > 3) document.getElementById("raccourcis").className = "raccourcis deux";
function solaire(){
  fetch("solaire.json?t=" + Date.now(), { cache: "no-store" }).then(function(r){ return r.ok ? r.json() : null; }).then(function(s){
    var a = document.getElementById("racc-energie");
    if (!a || !s || !s.disponible || typeof s.production_w !== "number") return;
    var w = s.production_w;
    a.innerHTML = '☀️ Énergie<span class="w">' + (w >= 1000 ? (w / 1000).toFixed(1).replace(".", ",") + " kW" : Math.round(w) + " W") + '</span>';
  }).catch(function(){});
}
solaire();
setInterval(solaire, 5 * 60 * 1000);

construire();
horloge();
charger();
meteo();
setInterval(meteo, 15 * 60 * 1000);   // toutes les 15 min pour suivre la pluie dans l'heure
setInterval(horloge, 1000);
setInterval(charger, RAFRAICHIR_MIN * 60 * 1000);
setInterval(decaler, 10 * 60 * 1000);
</script>
